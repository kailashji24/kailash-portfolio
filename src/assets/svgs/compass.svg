<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Outer circle -->
  <circle cx="16" cy="16" r="14" stroke="#E8B23A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  <!-- Inner reference circle -->
  <circle cx="16" cy="16" r="2" stroke="#E8B23A" strokeWidth="1.5"/>
  <!-- Cardinal tick marks — N, E, S, W -->
  <line x1="16" y1="2" x2="16" y2="6" stroke="#E8B23A" strokeWidth="1.5" strokeLinecap="round"/>
  <line x1="16" y1="26" x2="16" y2="30" stroke="#E8B23A" strokeWidth="1.5" strokeLinecap="round"/>
  <line x1="2" y1="16" x2="6" y2="16" stroke="#E8B23A" strokeWidth="1.5" strokeLinecap="round"/>
  <line x1="26" y1="16" x2="30" y2="16" stroke="#E8B23A" strokeWidth="1.5" strokeLinecap="round"/>
  <!-- Intercardinal tick marks — NE, SE, SW, NW (shorter) -->
  <line x1="23.9" y1="8.1" x2="22.1" y2="9.9" stroke="#E8B23A" strokeWidth="1" strokeLinecap="round"/>
  <line x1="23.9" y1="23.9" x2="22.1" y2="22.1" stroke="#E8B23A" strokeWidth="1" strokeLinecap="round"/>
  <line x1="8.1" y1="23.9" x2="9.9" y2="22.1" stroke="#E8B23A" strokeWidth="1" strokeLinecap="round"/>
  <line x1="8.1" y1="8.1" x2="9.9" y2="9.9" stroke="#E8B23A" strokeWidth="1" strokeLinecap="round"/>
  <!-- North needle (pointed, gold) -->
  <polygon points="16,5 14.5,16 16,14 17.5,16" stroke="#E8B23A" strokeWidth="1.5" strokeLinejoin="round"/>
  <!-- South needle (blunt, same stroke) -->
  <polygon points="16,27 14.5,16 16,18 17.5,16" stroke="#E8B23A" strokeWidth="1.5" strokeLinejoin="round"/>
</svg>
