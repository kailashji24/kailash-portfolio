<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Left loop -->
  <path
    d="M6 12 C6 7, 1 7, 1 12 C1 17, 6 17, 6 12 C6 9, 9 8, 12 12"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  <!-- Right loop -->
  <path
    d="M18 12 C18 7, 23 7, 23 12 C23 17, 18 17, 18 12 C18 9, 15 8, 12 12"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  <!-- Crossing strand — left over right -->
  <path
    d="M9 10 C10 11, 11 11.5, 12 12"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
  />
  <path
    d="M12 12 C13 12.5, 14 13, 15 14"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
  />
  <!-- Center knot cross-over (gap implies over/under) -->
  <path
    d="M9 14 C10 13, 11 12.5, 11.4 12.2"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
  />
  <path
    d="M12.6 11.8 C13 11.5, 14 11, 15 10"
    stroke="#8FA3B8"
    strokeWidth="1.5"
    strokeLinecap="round"
  />
</svg>
